name: Deploy to FUSE satellite bucket

on:
  push:
    tags:
      - dev
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.ref_name }}

    steps:
      - name: Checkout rfxgen
        uses: actions/checkout@v4

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Match the local Homebrew formula version. Bump in lockstep when
          # contributors upgrade — confirm with `emcc --version` locally first.
          version: 5.0.7
          actions-cache-folder: 'emsdk-cache'

      # setup-emsdk prepends the emsdk root to PATH, which contains a `node/`
      # SUBDIRECTORY (the bundled node install tree). Shell PATH lookup for
      # `node` then resolves to that directory and exec fails with "Permission
      # denied" on Linux. Putting actions/setup-node AFTER prepends a real
      # node binary's bin dir, which wins the lookup.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & test web bundle
        run: make -C web test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: GitHubActions-rfxgen
          aws-region: us-east-2

      - name: Assemble deploy bundle
        run: |
          mkdir -p deploy/dist
          cp web/index.html web/styles.css web/rfxgen.ico deploy/
          cp web/app.mjs web/bridge.mjs web/audio.mjs web/wav.mjs web/notes.mjs deploy/
          cp web/dist/rfxgen-engine.mjs deploy/dist/
          ls -laR deploy

      - name: Resolve satellite bucket from SSM
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name /laravel/satellite-apps-bucket \
            --query Parameter.Value --output text)
          echo "SATELLITE_BUCKET=$BUCKET" >> $GITHUB_ENV

      - name: Push to S3
        run: |
          aws s3 sync deploy/ "s3://${SATELLITE_BUCKET}/rfxgen/" --delete
          # .mjs isn't in Python's default mimetypes DB, so the AWS CLI uploads
          # them as application/octet-stream — and browsers refuse to import
          # ESM modules with that content-type. Fix the metadata in place.
          aws s3 cp \
            "s3://${SATELLITE_BUCKET}/rfxgen/" \
            "s3://${SATELLITE_BUCKET}/rfxgen/" \
            --recursive --exclude '*' --include '*.mjs' \
            --content-type 'text/javascript' --metadata-directive REPLACE
